name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (FractionCore)
        run: swift test --package-path Packages/FractionCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app for simulator
        run: |
          xcodebuild build \
            -project Fractionator.xcodeproj \
            -scheme Fractionator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
