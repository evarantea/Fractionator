name: TestFlight

# Builds a signed release and uploads it to App Store Connect, from where it reaches TestFlight
# and can be submitted for review. Run it by hand from the Actions tab.
#
# Required repository secrets:
#   APPLE_TEAM_ID                 10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID                    App Store Connect API key ID
#   ASC_ISSUER_ID                 App Store Connect API issuer ID
#   ASC_KEY_P8                    Full contents of the downloaded AuthKey_XXXX.p8 file

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 1.0.0"
        required: true
        default: "1.0.0"

jobs:
  upload:
    runs-on: macos-15
    env:
      KEY_PATH: ${{ github.workspace }}/AuthKey.p8
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (FractionCore)
        run: swift test --package-path Packages/FractionCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"

      - name: Archive
        run: |
          xcodebuild archive \
            -project FractionSprint.xcodeproj \
            -scheme FractionSprint \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FractionSprint.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export and upload to App Store Connect
        run: |
          plutil -insert teamID -string "${{ secrets.APPLE_TEAM_ID }}" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/FractionSprint.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Remove API key
        if: always()
        run: rm -f "$KEY_PATH"
