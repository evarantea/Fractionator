name: FractionSprint
options:
  bundleIdPrefix: com.evarantea
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FractionCore:
    path: Packages/FractionCore
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
targets:
  FractionSprint:
    type: application
    platform: iOS
    sources:
      - path: FractionSprint
    dependencies:
      - package: FractionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evarantea.fractionsprint
        PRODUCT_NAME: FractionSprint
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: FractionSprint/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fraction Sprint
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
schemes:
  FractionSprint:
    build:
      targets:
        FractionSprint: all
    archive:
      config: Release
