name: Fractionator
options:
  bundleIdPrefix: com.evarantea
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FractionCore:
    path: Packages/FractionCore
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
targets:
  Fractionator:
    type: application
    platform: iOS
    sources:
      - path: Fractionator
    dependencies:
      - package: FractionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evarantea.fractionator
        PRODUCT_NAME: Fractionator
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Fractionator/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fractionator
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
schemes:
  Fractionator:
    build:
      targets:
        Fractionator: all
    archive:
      config: Release
